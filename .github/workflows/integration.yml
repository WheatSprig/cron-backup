name: Integration

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/integration/**"
      - "Dockerfile"
      - ".github/workflows/integration.yml"
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    paths:
      - "src/**"
      - "tests/integration/**"
      - "Dockerfile"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show container tooling
        run: |
          docker version
          docker compose version

      - name: Run integration tests
        run: bash tests/integration/run.sh
