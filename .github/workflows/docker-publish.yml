name: Build and Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  docker-build-publish:
    runs-on: ubuntu-latest

    permissions:
      packages: write
      contents: read

    env:
      IMAGE_NAME: cron-backup

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert owner to lowercase
        id: vars
        run: echo "owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          IMAGE="ghcr.io/${{ steps.vars.outputs.owner_lower }}/${{ env.IMAGE_NAME }}"
          REF="${{ github.ref_name }}"
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "tags=${IMAGE}:edge" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == *-* ]]; then
            echo "tags=${IMAGE}:${REF}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${REF},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            RCLONE_VERSION=1.76.0
          tags: ${{ steps.tags.outputs.tags }}
