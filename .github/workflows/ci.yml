name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "feat/**"
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CronBackup.sln

      - name: Build
        run: dotnet build CronBackup.sln --no-restore -c Release

      - name: Test
        run: dotnet test CronBackup.sln --no-build -c Release
