version: "3.8"

# v2 运行示例。启用其中一个服务即可。
# 镜像 tag 2 对应 v2；v1 的 shell 版本见 git tag v1。

services:
  # 模式一：挂载 config.yaml，常驻调度
  cron-backup:
    image: ghcr.io/wheatsprig/cron-backup:2
    restart: unless-stopped
    volumes:
      - ./data:/backup/data:ro
      - ./config:/config:ro
    environment:
      TZ: Asia/Shanghai
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SFTP_PASSWORD: ${SFTP_PASSWORD}
      PGPASSWORD: ${PGPASSWORD}
      NTFY_URL: ${NTFY_URL}
      HEALTHCHECKS_URL: ${HEALTHCHECKS_URL}
      WEBHOOK_URL: ${WEBHOOK_URL}

  # 模式二：只跑一次，适合 CI 或手动触发
  cron-backup-once:
    image: ghcr.io/wheatsprig/cron-backup:2
    volumes:
      - ./data:/backup/data:ro
      - ./config:/config:ro
    environment:
      TZ: Asia/Shanghai
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SFTP_PASSWORD: ${SFTP_PASSWORD}
    command: ["run", "--once"]
    healthcheck:
      disable: true

  # 模式三：不挂 config.yaml，用内联 YAML 定义一到两个 job。
  # Compose 会先做自己的 $ 插值，所以应用层的占位符必须写成 $${VAR}。
  cron-backup-inline:
    image: ghcr.io/wheatsprig/cron-backup:2
    restart: unless-stopped
    volumes:
      - ./data:/backup/data:ro
    environment:
      TZ: Asia/Shanghai
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      CRONBACKUP_CONFIG_YAML: |
        version: 1
        defaults:
          retention:
            daily: 7
            weekly: 4
            monthly: 6
            max_delete: 20
        jobs:
          - name: photos
            schedule: "0 2 * * *"
            source:
              path: /backup/data
            destinations:
              - name: s3
                kind: s3
                provider: Minio
                endpoint: https://s3.example.com
                region: us-east-1
                bucket: backups
                root: photos
                access_key_id: $${S3_ACCESS_KEY_ID}
                secret_access_key: $${S3_SECRET_ACCESS_KEY}

  # 模式四：v1 环境变量兼容，单 job，不写 config.yaml。
  # 隐式 job 默认不启用 retention。
  cron-backup-legacy-env:
    image: ghcr.io/wheatsprig/cron-backup:2
    restart: unless-stopped
    volumes:
      - ./data:/backup/data:ro
    environment:
      BACKUP_SRC: /backup/data
      CRON_SCHEDULE: "0 2 * * *"
      RCLONE_REMOTE_NAMES: backup
      RCLONE_backup_TYPE: s3
      RCLONE_backup_PROVIDER: Minio
      RCLONE_backup_ENDPOINT: https://s3.example.com
      RCLONE_backup_REGION: us-east-1
      RCLONE_backup_BUCKET: backups
      RCLONE_PATH: /photos
      RCLONE_backup_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      RCLONE_backup_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
