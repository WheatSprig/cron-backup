services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testuser
      MINIO_ROOT_PASSWORD: testpassword
    volumes:
      - ${TEST_ROOT}/minio-data:/data

  sftp:
    image: ${SFTP_IMAGE:-atmoz/sftp:alpine}
    command: testuser:testpassword:1001
    volumes:
      - ${TEST_ROOT}/sftp-data:/home/testuser/backup

networks:
  default:
    name: ${NETWORK_NAME}
