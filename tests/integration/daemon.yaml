version: 1

defaults:
  timezone: UTC
  log_target: console

jobs:
  - name: daemon
    interval_seconds: 30
    source:
      path: /data
    verify: size
    destinations:
      - name: s3
        kind: s3
        provider: Minio
        endpoint: http://minio:9000
        region: us-east-1
        bucket: backups
        root: daemon
        access_key_id: ${S3_KEY}
        secret_access_key: ${S3_SECRET}
        no_check_bucket: false
